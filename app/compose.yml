services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: ./
        target: /app
        consistency: cached
      - type: volume
        source: go_mod_cache
        target: /go/pkg/mod
      - type: volume
        source: go_build_cache
        target: /root/.cache/go-build
    environment:
      DATABASE_URL: postgres://dev-user:pswd@db:5432/dev-db?sslmode=disable
      HTTP_PORT: "8080"
      PUBLIC_BASE_URL: http://localhost:8080
      ADMIN_BASE_URL: http://admin.localhost:8080
      ENV: DEVELOPMENT
      CF_ACCESS_TEAM_DOMAIN: ""
      CF_ACCESS_AUD: ""
      ADMIN_EMAIL: ""
      S3_ENDPOINT: http://localstack:4566
      S3_REGION: us-east-1
      S3_BUCKET: kakkky-dev-images
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      S3_USE_PATH_STYLE: "true"
      IMAGE_BASE_URL: http://localhost:4566/kakkky-dev-images
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
      GA_PROPERTY_ID: ${GA_PROPERTY_ID:-}
      GA_SERVICE_ACCOUNT_KEY_B64: ${GA_SERVICE_ACCOUNT_KEY_B64:-}
    depends_on:
      - db
      - localstack
  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dev-user
      POSTGRES_PASSWORD: pswd
      POSTGRES_DB: dev-db
    volumes:
      - type: volume
        source: db_data
        target: /var/lib/postgresql/data
  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      PERSISTENCE: "1"
      DEBUG: "0"
    volumes:
      - type: volume
        source: localstack_data
        target: /var/lib/localstack
      - type: bind
        source: ./script/localstack
        target: /etc/localstack/init/ready.d

volumes:
  db_data:
  go_mod_cache:
  go_build_cache:
  localstack_data:
